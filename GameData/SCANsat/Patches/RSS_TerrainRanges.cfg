// SCANsat altimetry palette ranges for Real Solar System.
//
// Without a node here a body's range is pqsController.radiusMin/Max, which for a Kopernicus body
// built from a template is the template's numbers rather than the body's. The eleven moons below
// are that case, measured from their PQS at 0.1 degrees - a 3600x1800 grid per body, fine enough to
// land on a summit that a 1 degree grid steps straight over.
//
// Two distinct flavours of the same defect, both worth knowing:
//
//   Mimas, Enceladus, Tethys, Dione, Rhea, Iapetus and Triton all report -1200..9900 m, and they
//   measure 187..7661 m - identically, to the metre, with both extremes at the same coordinates.
//   RSS gives these seven the same terrain, not merely the same bounds. The old range spent 1387 m
//   below the lowest point and 2239 m above the highest, so a third of the palette drew elevations
//   that do not exist on them.
//
//   Ariel, Umbriel, Titania and Oberon all report -450..10260 m but measure differently from each
//   other. Here only the bounds were inherited; the terrain is procedurally distinct. Nothing short
//   of measuring could have separated these four.
//
// Deliberately absent: every other body, and that is the point of this file. A body that sets its
// own PQS bounds is already close enough, so nothing here should override it.
//
// Earth shows why leaving them alone is right. Its PQS declares -10940..8720 m; the height map it
// is built from (16384x8192 16-bit, offset -10921, deformity 19606) actually contains -10857..8386,
// because no texel reaches full scale. So the declaration overstates the real terrain by 334 m at
// the top - 4%, invisible on a map. A 0.1 degree survey of the same body returns 6859 m, 1527 m
// short, because a lattice that lands on the Challenger Deep almost exactly still steps over
// summits. Measuring is the worse of the two errors, so the declaration stays.
//
// The eleven moons are the only case where a body declares some other body's numbers rather than
// its own, which is why they are the only entries here.

SCANSAT_TERRAIN:NEEDS[RealSolarSystem]
{
	name = Mimas
	minHeightRange = 100
	maxHeightRange = 7700
}
