// SCANsat Visual-map texture sources for Real Solar System.
// SCANsat loads one mip level of each file straight to the GPU through KSPTextureLoader - the
// smallest mip that still covers the open map - so the resolution variant of RSS-Textures does
// not matter and Kopernicus OnDemand is never asked to load a body's ScaledSpace textures for it.
// heightMap is declared for the cfg contract; SCANsat does not use it yet.

SCANSAT_BODY_TEXTURES:NEEDS[RealSolarSystem]
{
	name = Earth
	colorMap = RSS-Textures/EarthColor.dds
	normalMap = RSS-Textures/Earth_NRM.dds
	heightMap = RSS-Textures/PluginData/EarthHeight.dds
}
