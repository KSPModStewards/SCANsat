	{
		#autoLOC_SCANsat_BTDT_Title			= SCAN Been There Done That®
		#autoLOC_SCANsat_BTDT_Description		= Этот небольшой датчик может автоматически обнаруживать близлежащие аномалии. Поскольку он работает только на очень коротких расстояниях и на очень низких высотах, он в основном полезен для отслеживания уже обнаруженных аномалий, которые были посещены.

		#autoLOC_SCANsat_BTDT_Exo_Description 		= Эта модель сканирующего устройства содержит набор пассивных и активных датчиков, предназначенных для быстрого обнаружения интересных объектов поблизости. 

		#autoLOC_SCANsat_Multi_Title			= SCAN Мультиспектральный датчик
		#autoLOC_SCANsat_Multi_Description		= Этот мультиканальный датчик обнаруживает излучение в нескольких инфракрасных, видимых и радиолокационных диапазонах. Это даёт ему возможность различать типы местности и биомы. Он также может обнаруживать аномалии, такие как наземные сооружения.

		#autoLOC_SCANsat_Radar_Title			= SCAN Радиолокационный высотомер
		#autoLOC_SCANsat_Radar_Description		= SCAN представляет вам этот высокопроизводительный радиолокационный высотомер. Это базовая модель в данном семействе датчиков, обычно продаётся в комплекте с игрушечными ракетами и радиоуправляемыми моделями самолётов. После того как фокус-группа выяснила, что 95% целевой аудитории пытались примотать его к выхлопной трубе ракетных двигателей изолентой, эта новая и улучшенная модель стала ещё проще в использовании.

		#autoLOC_SCANsat_SAR_Title			= SCAN Радиолокационный высотомер с синтезированной апертурой
		#autoLOC_SCANsat_SAR_Description		= Этот радиолокационный датчик с синтезированной апертурой использует траекторию полёта для имитации гораздо большей антенны. Это позволяет определять высоту местности с гораздо более высоким разрешением. Минусом является то, что его поле зрения сравнительно узкое, и он лучше работает на больших высотах.
		
		#autoLOC_SCANsat_Radar3B_Title				= Высотомер R-3B
		#autoLOC_SCANsat_Radar3B_Description	= Высокоточный радиолокационный высотомер позволяет собирать базовые данные о рельефе в очень узкой полосе под спутником. Потребляет умеренное количество энергии и функционирует при освещении и в темноте.
		
		#autoLOC_SCANsat_RadarEO_Title				= Радиолокационная антенна R-EO-1
		#autoLOC_SCANsat_RadarEO_Description	= Этот базовый L-диапазонный радиолокационный высотомер собирает данные о рельефе с низким разрешением на средней ширине полосы с низких орбит. Потребляет умеренное количество энергии и функционирует при освещении и в темноте.
	
		#autoLOC_SCANsat_SARX_Title				= Антенна SAR-X
		#autoLOC_SCANsat_SARX_Description	= Базовый радиолокационный прибор с синтезированной апертурой, который посылает радиосигналы и использует движение спутника во время посылки для синтеза их приёма гораздо более крупной антенной. Эффективно захватывает данные о рельефе с высоким разрешением в очень узкой полосе с низких орбит. Потребляет большое количество энергии, но функционирует при освещении и в темноте.
		
		#autoLOC_SCANsat_SARC_Title				= Антенна SAR-C
		#autoLOC_SCANsat_SARC_Description	= Усовершенствованный радиолокационный прибор с синтезированной апертурой, который потребляет больше энергии для работы на больших ширинах полосы и с больших высот. Эффективно захватывает данные о рельефе с высоким разрешением со средних орбит, но ограничен очень узким диапазоном работы. Потребляет большое количество энергии и функционирует при освещении и в темноте.
		
		#autoLOC_SCANsat_SARL_Title				= Антенна SAR-L
		#autoLOC_SCANsat_SARL_Description	= Самый продвинутый радиолокационный прибор с синтезированной апертурой, который использует массивную антенну для передачи и приёма множества поляризаций радиоэнергии. Может картировать большие полосы местности с высоких орбит, а благодаря богатству получаемых данных — также и биомы. Потребляет очень большое количество энергии и функционирует при освещении и в темноте.
	
		#autoLOC_SCANsat_Multi_MS1_Title					= Мультиспектральный сканер MS-1
		#autoLOC_SCANsat_Multi_MS1_Description		= Этот сканер с низким разрешением наблюдает свет, отражённый от поверхности цели, для получения карт цвета и биомов с низкой детализацией. Из-за базовых компонентов в этой модели сканера его необходимо размещать на низких орбитах для эффективной работы, и он не может обнаруживать ресурсы. Потребляет небольшое количество энергии и работает только при дневном свете.
		
		#autoLOC_SCANsat_Multi_MSR_Title					= Усовершенствованный мультиспектральный сканер MS-R
		#autoLOC_SCANsat_Multi_MSR_Description		= Усовершенствованный мультиспектральный сканер — настоящий «мастер на все руки», наблюдающий свет, отражённый от поверхности планеты, и создающий изображения с низкой детализацией цвета и карты биомов. Он даже может обнаруживать наземные ресурсы. Улучшенная оптика и электроника позволяют эффективно работать на более высоких орбитах по сравнению с базовыми моделями, но только в узкой полосе. Потребляет небольшое количество энергии и работает только при дневном свете.
		
		#autoLOC_SCANsat_Multi_MS2A_Title				= Продвинутый мультиспектральный сканер MS-2A
		#autoLOC_SCANsat_Multi_MS2A_Description	= Изучая оптические длины волн в нескольких спектральных каналах, продвинутая модель сканера создаёт изображения с низкой детализацией цвета, карты биомов и распределения ресурсов. Потребляет небольшое количество энергии и работает только при дневном свете.
	
		#autoLOC_SCANsat_VS1_Title			= Визуализатор высокого разрешения VS-1
		#autoLOC_SCANsat_VS1_Description	= Этот базовый наблюдательный телескоп создаёт прекрасные высокодетализированные цветные изображения — но только с низкой орбиты. Потребляет небольшое количество энергии и функционирует только при освещении.
	
		#autoLOC_SCANsat_VS3_Title			= Продвинутый визуализатор высокого разрешения VS-3
		#autoLOC_SCANsat_VS3_Description = Вершина кербальского неправительственного высокоразрешающего наблюдения, этот крупный и дорогой изображатель создаёт высокодетализированные цветные изображения и может идентифицировать уникальные особенности поверхности. Потребляет небольшое количество энергии и функционирует только при освещении.
	
		#autoLOC_SCANsat_VS11_Title			= Секретный разведывательный визуализатор VS-11
		#autoLOC_SCANsat_VS11_Description = *УДАЛЕНО* может наблюдать *УДАЛЕНО* цели каждые *УДАЛЕНО* с высот от *УДАЛЕНО* до *УДАЛЕНО*. Такие удивительные *УДАЛЕНО* привели *УДАЛЕНО* к предположению, что *УДАЛЕНО* *УДАЛЕНО*. Потребляет умеренное количество энергии и функционирует только при освещении.
	
		#autoLOC_SCANsat_R_Title					= SCAN-R Картограф ресурсов
		#autoLOC_SCANsat_R_Description		= Базовый прибор для картографирования ресурсов, хорошо работающий на низких орбитальных высотах, хотя и сканирует только в очень узкой полосе. Потребляет умеренное количество энергии и функционирует только при освещении.
	
		#autoLOC_SCANsat_R2_Title				= SCAN-R2 Усовершенствованный картограф ресурсов
		#autoLOC_SCANsat_R2_Description 	= Прибор среднего уровня для картографирования ресурсов, который может оценивать полезные ресурсы с более высоких орбит. Потребляет умеренное количество энергии и функционирует только при освещении.
	
		#autoLOC_SCANsat_RX_Title				= SCAN-RX Гиперспектральный картограф ресурсов
		#autoLOC_SCANsat_RX_Description	= Высокотехнологичный прибор для картографирования ресурсов, который захватывает сотни каналов данных для оценки распределения полезных ресурсов с более высоких орбит. Потребляет небольшое количество энергии и функционирует только при освещении.
	}
}
