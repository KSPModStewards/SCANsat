[project]
name = "mirage-integration-test"
version = "0.1.0"
description = "Mock up of desired pipeline for integrating Mirage binary data into SCANsat."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ipympl>=0.10.0",
    "ipython>=9.14.1",
    "ipywidgets>=8.1.8",
    "jupyter-compare-view>=0.2.4",
    "matplotlib>=3.10.9",
    "natsort>=8.4.0",
    "numpy>=2.4.6",
    "opencv-python>=4.13.0.92",
    "pillow>=12.2.0",
    "texture2ddecoder>=1.0.6",
]

[dependency-groups]
dev = ["pytest>=9.0.2", "pytest-cov>=7.0.0", "ruff>=0.15.2"]

# [[tool.uv.index]]
# name = "extra"
# url = "link_to_extra_repo"
# default = true

[tool.pyright]
venvPath = "."
venv = ".venv"
extraPaths = ["./venv/Lib"]
pythonVersion = "3.12"

# [project.urls]
# repository = "ADD git repo here idiot"

# [tool.setuptools]
# packages = ["vs_code_decoder"]

# [tool.setuptools_scm]
# version_file = "version.py"
# version_file_template = "# Generated by setuptools-scm. Do not edit\n__version__ = {version!r}\n__version_tuple__ = {version_tuple!r}\n"

[tool.ruff]
exclude = [".venv"]
target-version = "py312"
line-length = 88
indent-width = 4

[tool.ruff.isort]
length-sort = true
lines-between-types = 1
